name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      # Also taps this repository as ben-reverselab/tap
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
      - name: Style
        run: brew style ben-reverselab/tap
      - name: Audit
        run: |
          for cask in "$(brew --repository ben-reverselab/tap)"/Casks/*.rb; do
            brew audit --cask --strict --online "ben-reverselab/tap/$(basename "$cask" .rb)"
          done
